[package]
name = "sashite-sanki-kernel-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
description = "The sanki reference rule system as a WebAssembly module under sashite.sanki.kernel-abi/1 — the engine and the session kernel behind one deterministic interface, built for Sashité."
repository = "https://github.com/sashite/sanki-kernel-wasm.rs"
homepage = "https://sashite.com/"
readme = "README.md"
keywords = ["chess", "ogi", "xiongqi", "wasm", "nostr"]
categories = ["games", "wasm"]
exclude = ["/build", "/harness", "/.github", "/tests/conformance"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sashite-sanki-engine = "0.11.1"
sashite-sanki-session = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = { version = "5", default-features = false }

[dev-dependencies]
sha2 = "0.10"
wasmi = { version = "2", features = ["deterministic"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
overflow-checks = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
iter_over_hash_type = "deny"

